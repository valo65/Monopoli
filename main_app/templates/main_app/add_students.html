{% extends 'main_app/base.html' %}

{% block title %}Добави студенти{% endblock %}

{% block content %}
<div class="content">
    <h1>➕ Добави студенти в "{{ group.name }}"</h1>

    <!-- Филтър по група -->
    <form method="get" style="margin-bottom: 20px;">
        <label>Филтър по група:</label>
        <select name="group_filter" onchange="this.form.submit()"
                style="padding:8px; border-radius:6px;">
            <option value="">-- Всички --</option>
            {% for g in available_groups %}
                <option value="{{ g }}" {% if group_filter == g %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
        </select>
    </form>

    <form method="post">
        {% csrf_token %}
        {% if students %}
            <ul style="list-style: none; padding: 0;">
                {% for student in students %}
                    <li style="padding: 10px; background: rgba(255,255,255,0.1);
                               margin: 5px 0; border-radius: 6px;">
                        <label>
                            <input type="checkbox" name="students" value="{{ student.id }}">
                            {{ student.get_full_name }}
                            ({{ student.profile.faculty_number }})
                            – група: {{ student.profile.group|default:"—" }}
                        </label>
                    </li>
                {% endfor %}
            </ul>
            <button type="submit" class="btn">Добави избраните</button>
        {% else %}
            <p>Няма намерени студенти.</p>
        {% endif %}
    </form>
</div>
{% endblock %}
